services:
  # ── Pruebas: nuxt dev server, puerto 3001 ───────────────────────────────────
  # Para rebuildar con cambios: docker compose up --build dev
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3001:3000"
    volumes:
      - dev-data:/app/data
      - dev-uploads:/app/uploads
      - ./control:/app/control
    env_file:
      - .env
    restart: unless-stopped

  # ── Producción: imagen compilada, puerto 3000 ────────────────────────────────
  # Para rebuildar con cambios: docker compose up --build prod
  prod:
    build:
      context: .
      target: prod
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    ports:
      - "3000:3000"
    volumes:
      - prod-data:/app/data
      - prod-uploads:/app/uploads
      # Canal de control con el agente host (auto-update). El agente escribe/lee
      # acá; la app escribe requests y lee status. Bind mount, no volume.
      - ./control:/app/control
    env_file:
      - .env
    restart: unless-stopped

volumes:
  dev-data:
  dev-uploads:
  prod-data:
  prod-uploads:
